spring:
  application:
    name: TourTracker Backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tour_tracker}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': true
    open-in-view: false

  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null

  # Multipart upload limits
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

# Logging Configuration
logging:
  level:
    root: INFO
    '[org.example.backend]': DEBUG
    '[org.springframework.web]': INFO
    '[org.springframework.security]': DEBUG
    '[org.hibernate.SQL]': DEBUG
    '[org.hibernate.type.descriptor.sql.BasicBinder]': TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/tourtracker.log
    max-size: 10MB
    max-history: 30

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api

# JWT Authentication + Image Storage
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000          # 15 minutes
    refresh-expiration-days: 7
  cookie:
    secure: ${COOKIE_SECURE:false}  # set true in production (HTTPS)
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
  rate-limit:
    trusted-proxies: ${TRUSTED_PROXY_IPS:}  # comma-separated IPs of trusted reverse proxies
  storage:
    image-dir: ${IMAGE_DIR:./tour-images}

# API Documentation
springdoc:
  swagger-ui:
    path: /docs
    enabled: true
  api-docs:
    path: /api-docs
