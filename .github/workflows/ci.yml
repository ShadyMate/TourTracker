name: CI

# Do tests on each push and pull request
on:
  push:
    branches: [ master, feature/** ]
  pull_request:
    branches: [ master ]


jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tour_tracker
          POSTGRES_USER: tourtracker
          POSTGRES_PASSWORD: tourtracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Run tests
        working-directory: backend
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DB_URL: jdbc:postgresql://localhost:5432/tour_tracker
          DB_USERNAME: tourtracker
          DB_PASSWORD: tourtracker
        run: ./mvnw test